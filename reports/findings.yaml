# MP303 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G080"          # your group id, e.g. "G042"
problem_id: "MP303"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: kg_weighed_at_factory           # the column that must not be used as a feature
  unit_mixup:
    present: false
    column: null
    group_value: null
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: temp_c
    value: 9999.0
    count: 46            # how many rows have it
  duplicate_rows:
    present: false
    count: null           # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 8            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: flush
    true_levels: 3      # how many real categories there are after cleaning

tracking:
  experiment_name: "MP303_Tea_Leaf_Plucking"
  best_run_id: "PASTE_YOUR_V1_RUN_ID_HERE"
  registered_model_name: "mp303-tea-leaf-regressor"
  champion_version: 1

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    worker_exp_yr: null
    rain_mm_week: null
    slope_deg: null
    temp_c: null
    bush_age_yr: null
    hours_worked: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of section
    'Upper Garden': null
    'Lower Garden': null
    'River Side': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
