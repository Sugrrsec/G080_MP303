
name: MP303 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.5.5 pandas==2.2.3 scikit-learn==1.9.1 mlflow==3.15.0 PyYAML==6.0.4 pytest==9.2.0

      - name: Run tests
        run: python -m pytest -v
